<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060810">
  <title>TemuTalk</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <!-- Preload Leaflet so it's ready the moment the radio tab is opened -->
  <link rel="preload" as="style"  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preload" as="script" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  <link rel="preload" as="script" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
  <!-- Per-tab stylesheets -->
  <link rel="stylesheet" href="/home/style.css">
  <link rel="stylesheet" href="/music/style.css">
  <link rel="stylesheet" href="/radio/style.css">
  <link rel="stylesheet" href="/weather/style.css">
  <link rel="stylesheet" href="/news/style.css">
  <link rel="stylesheet" href="/finance/style.css">
  <link rel="stylesheet" href="/timer/style.css">
  <link rel="stylesheet" href="/system/style.css">
  <link rel="stylesheet" href="/assistant/style.css">
  <style>
    /* ── SPA view system ─────────────────────────────────────────────────── */
    html, body { height: 100%; overflow: hidden; }

    .view {
      /* --nav-w/--nav-h swap roles at the mobile breakpoint (see
         style.css) -- sidebar-on-the-left becomes bar-on-the-bottom, so
         this reserves space on whichever side actually has the nav. */
      position: fixed; top: 0; bottom: var(--nav-h); right: 0; left: var(--nav-w); z-index: 1;
      display: none; overflow: hidden;
      transition: opacity 260ms cubic-bezier(0.4,0,0.2,1),
                  transform 260ms cubic-bezier(0.4,0,0.2,1);
    }
    .view.v-on { will-change: opacity, transform; }
    .view.v-on { display: block; }
    #view-weather.v-on, #view-timer.v-on,
    #view-finance.v-on, #view-system.v-on,
    #view-news.v-on {
      overflow-y: auto;
    }
    #view-home.v-on { overflow: hidden; display: flex; flex-direction: column; }
    #view-music.v-on  { display: flex; flex-direction: column; }

    /* weather needs extra scroll room */
    #view-weather .page {
      padding-bottom: 60px;
    }

    /* Home's no-scroll "everything fits in one dashboard view" design
       (above) assumes a wide desktop viewport where the widgets row and
       snippet grid lay out side by side -- home/style.css's mobile pass
       stacks both vertically instead, which is taller than most phone
       viewports have room for. Must live here, not home/style.css: same
       #view-home.v-on ID+class specificity as the rule above, and this
       file's own inline <style> loads after every <link>'d stylesheet, so
       only an override *here* actually wins the cascade. */
    @media (max-width: 720px), (max-height: 480px) and (orientation: landscape) and (pointer: coarse) {
      #view-home.v-on { overflow-y: auto; }
    }

    /* ── Nav buttons ─────────────────────────────────────────────────────── */
    button.nav-item { background: none; border: none; font-family: inherit; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }

    /* ── Page headers ─────────────────────────────────────────────────────────────────── */
    .page-header { display: flex; align-items: center; gap: 10px; padding-top: 12px; font-size: 22px; font-weight: 600; }
    .page-header-accent { width: 4px; height: 28px; border-radius: 2px; flex-shrink: 0; }
  </style>
</head>
<body data-tab="home">

<div id="bg">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
  <div class="blob b4"></div>
</div>

<!-- ══════════════════ HOME VIEW (inline — immediate render) ══════════════════ -->
<div class="view v-on" id="view-home" style="opacity:1;">

  <!-- Top bar -->
  <div class="home-topbar">
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="chip" id="spotify-chip" style="display:none;"><span class="dot"></span> Spotify</span>
    </div>
    <button class="hub-bar-btn" id="fs-btn" onclick="toggleFullscreen()" title="Fullscreen">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path id="fs-path" d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
  </div>

  <!-- Hero clock -->
  <div class="home-hero">
    <div class="home-greeting" id="home-greeting">Good morning</div>
    <div class="home-time js-clock-time" id="clock">--:--</div>
    <div class="home-datestr" id="dateline">--</div>
  </div>

  <!-- Bottom compact widgets -->

    <!-- Weather card with timer floating above -->

      <!-- Mini timers: floats above the weather card -->

        </div>

<!-- Global "pick a Spotify device" modal (openDevicePickerModal() in
     music/script.js) -- shown when this device's own in-browser playback
     (the Web Playback SDK, which needs EME/DRM support) fails to activate
     within _useOwnDevice()'s timeout, instead of a dead-end alert(). Lives
     here rather than in music/view.html since it needs to work from any
     tab (e.g. autoplay firing while the Home tab is open), not just the
     lazily-loaded Music tab where the corner "Play on…" picker already is.
     Reuses that picker's device-row classes/icons (music/style.css) for a
     consistent look, just in a centered modal instead of a corner popover. -->
<div class="device-picker-modal" id="device-picker-modal" onclick="if(event.target===this)closeDevicePickerModal()">
  <div class="dpm-card">
    <div class="dpm-hdr">
      <div class="dpm-title">Play on…</div>
      <button class="dpm-close" onclick="closeDevicePickerModal()" title="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>
    <div class="dpm-sub">This device couldn't start playback directly — pick where to play instead.</div>
    <div class="dpm-list" id="dpm-list"></div>
  </div>
</div>

<script>
// ── Base path (set when reverse-proxied under a prefix, e.g. /temutalk) ────
const BASE_PATH = window.__BASE_PATH__ || '';

// ── Disable copy/right-click/drag on everything except form fields ─────────
// Pairs with style.css's user-select:none -- that alone stops a drag-select,
// but doesn't stop the right-click menu's own "Copy" item or a ctrl+C on
// text that got selected some other way (e.g. browser "Select All"), so
// those are blocked here too. Form fields opt back in to all three, same as
// they opt back in to user-select in CSS -- otherwise typing, pasting, and
// right-click-paste into e.g. the Spotify credential fields would break.
function _isFormField(el) {
  return !!el.closest('input, textarea, [contenteditable="true"]');
}
document.addEventListener('contextmenu', e => { if (!_isFormField(e.target)) e.preventDefault(); });
document.addEventListener('dragstart',   e => { if (!_isFormField(e.target)) e.preventDefault(); });
document.addEventListener('copy',        e => { if (!_isFormField(e.target)) e.preventDefault(); });

// ── Device type detection (mobile vs. desktop/tablet) ───────────────────────
// Two signals combined rather than either alone: a coarse/no-hover pointer
// means an actual touchscreen (not just a touch-capable hybrid laptop that
// also has a mouse), and the same max-width breakpoint style.css's mobile
// layout switches on means the *layout* itself agrees it's phone-sized --
// together that's a much more reliable "should this behave like a phone"
// signal than user-agent sniffing (fragile, spoofable, and notoriously
// wrong for e.g. iPadOS reporting as desktop Safari). CSS's own @media
// query is what actually drives the responsive layout; this just exposes
// the same determination to JS for the few things that need to branch
// behavior rather than pure styling (e.g. hiding the desktop-only
// fullscreen button below).
const MOBILE_BREAKPOINT_QUERY = '(max-width: 720px)';
function isMobileDevice() {
  return matchMedia('(hover: none) and (pointer: coarse)').matches
      && matchMedia(MOBILE_BREAKPOINT_QUERY).matches;
}
function _syncDeviceClass() {
  const mobile = isMobileDevice();
  document.documentElement.classList.toggle('is-mobile', mobile);
  document.documentElement.dataset.device = mobile ? 'mobile' : 'desktop';
}
_syncDeviceClass();
// Layout-affecting signals can change live -- rotating a tablet, resizing
// a desktop window past the breakpoint -- so this stays in sync rather
// than only ever detecting once at load.
matchMedia(MOBILE_BREAKPOINT_QUERY).addEventListener('change', _syncDeviceClass);

// ── Device identity ───────────────────────────────────────────────────────
if (!localStorage.getItem('deviceId'))
  localStorage.setItem('deviceId', ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g,c=>(c^crypto.getRandomValues(new Uint8Array(1))[0]&15>>c/4).toString(16)));
const deviceId = localStorage.getItem('deviceId');

// ── Spotify credentials (localStorage only — never sent to/stored on server) ──
function getSpotifyCreds() {
  return {
    cid:  localStorage.getItem('spotifyClientId')     || '',
    csec: localStorage.getItem('spotifyClientSecret') || '',
  };
}
function updateAuthScreen() {
  const { cid, csec } = getSpotifyCreds();
  const hasCreds = !!(cid && csec);
  document.getElementById('creds-form').style.display   = hasCreds ? 'none' : '';
  document.getElementById('connect-form').style.display = hasCreds ? ''     : 'none';
  if (hasCreds) {
    document.getElementById('auth-link').href =
      BASE_PATH + '/auth/spotify?device=' + encodeURIComponent(deviceId) +
      '&cid='  + encodeURIComponent(cid) +

// Auto-reloads a stale tab the moment the server reports a newer
// ASSET_VERSION (pushed on WS join -- see lib/ws.js) than what this page
// was actually loaded with. The server restarts on every deploy, but an
// already-open tab has no other way to learn that: nothing re-fetches an
// already-loaded <script>/<link> just because the origin changed, so a
// kiosk display left open across a deploy would otherwise keep silently
// running the old code indefinitely. Defers (instead of reloading
// mid-keystroke) while a text field is actively focused, so an in-progress
// credential entry isn't lost.
function _checkAssetVersion(v) {
  if (!window.__ASSET_V || String(v) === String(window.__ASSET_V)) return;
  const tryReload = () => {
    const el = document.activeElement;
    const typing = el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
    if (typing) { setTimeout(tryReload, 10000); return; }
    _reloadPage();
  };
  tryReload();
}
function _reloadPage() { location.reload(); }

// ── Lazy tab loader ───────────────────────────────────────────────────────
const _tabLoaded = { home: true }; // home is inline — already loaded

async function ensureTab(tab) {
  if (_tabLoaded[tab]) return;
  // ?v= busts any cache (browser or the Cloudflare tunnel's edge) sitting
  // between here and the server, same as the versioned <script>/<link> tags.
  const r = await fetch(BASE_PATH + '/' + tab + '/view.html' + (window.__ASSET_V ? '?v=' + window.__ASSET_V : ''));
  document.getElementById('view-' + tab).innerHTML = await r.text();
  _tabLoaded[tab] = true;
}

// ── Navigation ────────────────────────────────────────────────────────────
const TAB_IDX = { home: 0, music: 1, radio: 2, finance: 3, news: 4, weather: 5, timer: 6, system: 7 };
const TAB_TITLES = { home: 'TemuTalk', music: 'TemuTalk - Music', radio: 'TemuTalk - Radio', finance: 'TemuTalk - Finance', news: 'TemuTalk - News', weather: 'TemuTalk - Weather', timer: 'TemuTalk - Timer', system: 'TemuTalk - System' };
let curTab = 'home';
document.title = TAB_TITLES.home;

async function navigate(tab) {
  if (tab === curTab) return;
  await ensureTab(tab);

  document.title = TAB_TITLES[tab] || 'TemuTalk';
  document.body.dataset.tab = tab;
  const dir = TAB_IDX[tab] > TAB_IDX[curTab] ? 1 : -1;
  const $old = document.getElementById('view-' + curTab);
  const $new = document.getElementById('view-' + tab);

  // Blur whatever's focused in the tab we're leaving. Views are hidden via
  // opacity/transform, not removed from the DOM, so a focused field would
  // otherwise silently keep real DOM focus while off-screen -- then
  // mobile browsers pop the keyboard back up the instant that same field
  // becomes visible again on a later visit, with no field actually tapped.
  if (document.activeElement && $old.contains(document.activeElement)) {
    document.activeElement.blur();
  }

  // Set new view off-screen without transition
  $new.style.transition = 'none';
  $new.style.opacity = '0';
  $new.style.transform = 'translateX(' + (dir * 28) + 'px)';
  $new.classList.add('v-on');

  // Force reflow, then animate both
  $new.offsetHeight;
  $new.style.transition = '';
  $new.style.opacity = '1';
  $new.style.transform = '';
  $old.style.opacity = '0';
  $old.style.transform = 'translateX(' + (-dir * 28) + 'px)';

  const leaving = curTab;
  curTab = tab;

  setTimeout(() => {
    const $leaving = document.getElementById('view-' + leaving);
    $leaving.classList.remove('v-on');
    $leaving.style.opacity = '';
    $leaving.style.transform = '';
  }, 280);

  // Nav active state
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.tab === tab);
  });

  // Lazy-load tabs on first visit
  if (tab === 'weather' && !wxLoaded) {
    wxLoaded = true;
    const q = wxResolveQuery();
    if (q) { loadWx(q); wxUpdateCityBarVisibility(); }
    else { wxGeoDenied = true; wxUpdateCityBarVisibility(); showWxError('Search for a city below, or allow location access.'); }
  }
  if (tab === 'music')   { if (typeof loadMusicHome === 'function') loadMusicHome(); }
  if (tab === 'timer')   initTimerView();
  if (tab === 'finance' && !financeLoaded) { financeLoaded = true; finSwitch('crypto'); }

  if (tab === 'system')  { renderThemePanel(); if (typeof loadDeviceName === 'function') loadDeviceName(); }
  if (tab === 'radio') initRadioMap();
  if (tab === 'news' && !newsLoaded) loadNews();
  // Keep URL clean so hard refresh always lands on home
  if (location.search.includes('tab=')) {
    const u = new URL(location.href);
    u.searchParams.delete('tab');
    history.replaceState(null, '', u);
  }
}

function _hexToHsl(hex) {
  let r=parseInt(hex.slice(1,3),16)/255, g=parseInt(hex.slice(3,5),16)/255, b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), l=(max+min)/2;
  if (max===min) return [0,0,Math.round(l*100)];
  const d=max-min, s=l>.5?d/(2-max-min):d/(max+min);
  let h;
  if (max===r) h=((g-b)/d+(g<b?6:0))/6;
  else if (max===g) h=((b-r)/d+2)/6;
  else h=((r-g)/d+4)/6;
  return [Math.round(h*360), Math.round(s*100)];
}

function _hexToRgba(hex, a) {
  return `rgba(${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)},${a})`;
}

function _applyBlobColors(preset) {
  const cols = preset === 'custom'
    ? themeBlobHexes.map((hx, i) => _hexToRgba(hx, [.32, .28, .22, .16][i]))
    : BLOB_PRESETS[preset];
  ['b1','b2','b3','b4'].forEach((cls, i) => {
    document.querySelectorAll('.' + cls).forEach(el => {
      el.style.background = cols ? `radial-gradient(circle, ${cols[i]} 0%, transparent 58%)` : '';
    });
  });
}

function _applyFont(id, customName) {
  if (customName && customName.trim()) {
    const fam = customName.trim();
    const href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(fam).replace(/%20/g,'+')}:wght@400;500;600;700;800&display=swap`;
    let lk = document.getElementById('custom-font-link');
    if (!lk) { lk = document.createElement('link'); lk.rel='stylesheet'; lk.id='custom-font-link'; document.head.appendChild(lk); }
    if (lk.href !== href) lk.href = href;
    document.body.style.fontFamily = `'${fam}',-apple-system,BlinkMacSystemFont,sans-serif`;
    return;
  }
  const fonts = {
    nunito:  { name:'Nunito',        url:'https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap' },
    inter:   { name:'Inter',         url:'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap' },
    poppins: { name:'Poppins',       url:'https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap' },
    grotesk: { name:'Space Grotesk', url:'https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap' },
  };
  const f = fonts[id] || fonts.nunito;
  if (id !== 'nunito' && !document.querySelector(`link[data-font="${id}"]`)) {
    const lk = document.createElement('link'); lk.rel='stylesheet'; lk.href=f.url; lk.dataset.font=id;
    document.head.appendChild(lk);
  }
  document.body.style.fontFamily = `'${f.name}',-apple-system,BlinkMacSystemFont,sans-serif`;
}

function applyTheme() {
  const R = document.documentElement;

  // Accent color
  if (!themeAutoAccent) {
    let h, s;
    if (themeAccent === 'custom') {
      [h, s] = _hexToHsl(themeCustomHex);
    } else {
      const p = ACCENT_PRESETS.find(x => x.id === themeAccent) || ACCENT_PRESETS[16];
      h = p.h; s = p.s;
    }
    R.style.setProperty('--primary',      `hsl(${h},${s}%,73%)`);
    R.style.setProperty('--primary-dim',  `hsla(${h},${s}%,73%,.16)`);
    R.style.setProperty('--primary-dark', `hsla(${h},${s}%,73%,.12)`);
    R.style.setProperty('--primary-glow', `hsla(${h},${s}%,73%,.4)`);
  }

  // Dark level (or fully custom background colour)
  R.style.setProperty('--bg', themeDark === 'custom'
    ? themeBgHex
    : ({ dark:'#08090f', darker:'#030408', amoled:'#000000' }[themeDark] || '#08090f'));

  // Blobs visibility
  const bgEl = document.getElementById('bg');
  const showBlobs = (themeBlobsShow !== 'off');
  if (bgEl) bgEl.style.display = showBlobs ? '' : 'none';

  // Blob colors (only relevant when blobs are shown)
  _applyBlobColors(showBlobs ? themeBlobs : 'auto');

  // Dot grid — independent of blob visibility now, always set explicitly
  // so cascade doesn't interfere
  const showDots = (themeDotGrid !== 'off');
  document.body.style.backgroundImage = showDots
    ? 'radial-gradient(circle, rgba(255,255,255,.022) 1px, transparent 1px)'
    : 'none';
  document.body.style.backgroundSize = showDots ? '28px 28px' : '';

  // Glass — a single opacity slider drives all three surface tiers at a
  // fixed ratio (1 / 1.6 / 2.4), optionally tinted with the accent colour
  const base = Math.max(0, parseFloat(themeGlassOpacity) || 8) / 100;
  const glass = [base, base * 1.6, base * 2.4];
  let tintH = null, tintS = 0;
  if (themeGlassTint === 'on') {
    if (themeAccent === 'custom') [tintH, tintS] = _hexToHsl(themeCustomHex);
    else { const p = ACCENT_PRESETS.find(x => x.id === themeAccent) || ACCENT_PRESETS[16]; tintH = p.h; tintS = p.s; }
    tintS = Math.min(tintS, 55);
  }
  const surf = a => tintH === null ? `rgba(255,255,255,${a})` : `hsla(${tintH},${tintS}%,72%,${a})`;
  R.style.setProperty('--surface',         surf(glass[0].toFixed(3)));
  R.style.setProperty('--surface-hi',      surf(glass[1].toFixed(3)));
  R.style.setProperty('--surface-highest', surf(glass[2].toFixed(3)));
  const borderA = Math.max(0, parseFloat(themeBorderPct) || 18) / 100;
  R.style.setProperty('--glass-border', surf(borderA.toFixed(3)));

  // Radius — one slider for the base value, sm/lg derived at a fixed ratio
  const radPx = Math.max(0, parseFloat(themeRadiusPx) || 26);
  R.style.setProperty('--radius-sm', Math.round(radPx * 0.7) + 'px');
  R.style.setProperty('--radius',    Math.round(radPx) + 'px');
  R.style.setProperty('--radius-lg', Math.round(radPx * 1.3) + 'px');

  // Card shadows — intensity slider scales the shadow alpha, 0 = none
  const shadowPct = Math.max(0, parseFloat(themeShadowPct));
  if (shadowPct <= 0) {
    R.style.setProperty('--card-shadow', 'none');
    R.style.setProperty('--card-shadow-hover', 'none');
  } else {
    const sp = shadowPct / 100;
    R.style.setProperty('--card-shadow', `3px 4px 0 rgba(0,0,0,${(.55*sp).toFixed(3)}), 0 6px 24px rgba(0,0,0,${(.28*sp).toFixed(3)})`);
    R.style.setProperty('--card-shadow-hover', `4px 6px 0 rgba(0,0,0,${(.6*sp).toFixed(3)}), 0 12px 38px rgba(0,0,0,${(.35*sp).toFixed(3)})`);
  }

  // Blob motion
  document.body.classList.toggle('no-blob-motion', themeBlobMotion === 'off');

  // Clock size — one slider for the max size, min/vw scaled proportionally
  const clk = document.querySelector('.home-time');
  const clockPx = Math.max(20, parseFloat(themeClockPx) || 150);
  if (clk) clk.style.fontSize = `clamp(${Math.round(clockPx*0.53)}px, ${(clockPx*0.08).toFixed(1)}vw, ${Math.round(clockPx)}px)`;
  if (clk) clk.style.fontWeight = Math.max(100, Math.min(900, parseFloat(themeClockWeight) || 200));

  // Font
  _applyFont(themeFont, themeCustomFont);

  // Glow
  document.body.classList.toggle('no-glow', themeGlow === 'off');

  // Nav labels
  document.body.classList.toggle('no-nav-labels', themeNavLabels === 'hide');
}

function renderThemePanel() {
  const el = document.getElementById('theme-panel');
  if (!el) return;

  const pill = (label, val, cur, fn) =>
    `<button class="th-pill ${cur===val?'active':''}" onclick="${fn}('${val}')">${label}</button>`;
  const onoff = (label, cur, fn) =>
    `<div class="th-toggle-row" onclick="${fn}('${cur==='on'?'off':'on'}')">
      <div class="th-toggle ${cur==='on'?'on':''}"><div class="th-toggle-knob"></div></div>
      <span>${label}</span></div>`;
  let _sliderSeq = 0;
  const slider = (label, val, min, max, step, fn, unit='') => {
    const id = 'th-slider-' + (_sliderSeq++);
    return `<div class="th-slider-row">
      <div class="th-slider-hdr"><span>${label}</span><span class="th-slider-val" id="${id}">${val}${unit}</span></div>
      <input class="th-slider" type="range" min="${min}" max="${max}" step="${step}" value="${val}"
             oninput="document.getElementById('${id}').textContent=this.value+'${unit}';${fn}(this.value)">
    </div>`;
  };

  const swatches = ACCENT_PRESETS.map(p =>
    `<button class="th-swatch ${!themeAutoAccent&&themeAccent===p.id?'active':''} ${themeAutoAccent?'muted':''}"
      style="background:hsl(${p.h},${p.s}%,62%);" title="${p.label}"
      onclick="_setThemeAccent('${p.id}')"></button>`
  ).join('');

const DAYS   = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
function tick() {
  const n = new Date();
  let   h = n.getHours();
  const m = n.getMinutes().toString().padStart(2,'0');
  // Own mini gradient + background-clip:text (same technique the parent
  // clock uses), not a flat colour riding on the parent's much larger
  // gradient -- that was the earlier bug (invisible depending on where the
  // parent's gradient happened to land) and a flat colour loses the shaded
  // look the rest of the clock has. The gradient stops are declared twice --
  // hardcoded hex first, var() second -- so a browser old enough to lack
  // CSS custom properties (var() support landed in Chrome 49 / 2016) still
  // gets a real gradient via the hardcoded fallback instead of the
  // declaration being silently dropped as invalid.
  const secs = themeClockSec === 'on'
    ? '<span style="font-size:.4em;letter-spacing:0;margin-left:6px;vertical-align:baseline;color:#f87cc4;background-image:linear-gradient(135deg,#b09ffc,#f87cc4);background-image:linear-gradient(135deg,var(--primary),var(--pink));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">' + n.getSeconds().toString().padStart(2,'0') + '</span>'
    : '';
  const greetEl = document.getElementById('home-greeting');
  if (greetEl) greetEl.textContent = h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening';
  let clockHtml;
  if (themeClock === '12') {
    const ampm = h >= 12 ? 'pm' : 'am';
    h = h % 12 || 12;
    clockHtml = h + ':' + m + secs + '<span style="font-size:.32em;letter-spacing:0;margin-left:8px;vertical-align:middle;color:#a0a8c8;background-image:linear-gradient(135deg,#a0a8c8,#b09ffc);background-image:linear-gradient(135deg,var(--text-dim),var(--primary));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;">' + ampm + '</span>';
  } else {
    clockHtml = h.toString().padStart(2,'0') + ':' + m + secs;
  }
  // .js-clock-time -- every styled clock face on the page (the Home hero
  // clock, plus the smaller ones in the full-screen lyrics views), not just
  // the one #clock id, so they all stay in perfect sync with each other and
  // with the 12h/24h + seconds theme settings from a single tick().
  document.querySelectorAll('.js-clock-time').forEach(el => { el.innerHTML = clockHtml; });
  document.getElementById('dateline').textContent =
    DAYS[n.getDay()] + ', ' + MONTHS[n.getMonth()] + ' ' + n.getDate();
}

// ── Weather: shared state for the home widget + Weather tab ────────────────
// These used to be two independent fetch/render pipelines that never told
// each other about changes -- a manual search on the Weather tab never
// reached the home widget, and if the tab had already been visited before
// geolocation resolved, it never picked up the real location either. Now
// there's one query resolver and one refresh function; anything that
// changes the query (geolocation resolving, a manual search) calls
// wxRefreshAll() so both surfaces always agree.
let wxCity        = localStorage.getItem('wxCity')   || ''; // last manual search (Weather tab fallback)
let wxLocQuery    = localStorage.getItem('wxCoords') || ''; // "lat,long" from geolocation
let wxServerCity  = '';
let wxLoadedQuery = '';
let wxGeoDenied   = false; // geolocation unavailable/denied -- only then does manual search matter

// Geolocation always wins when available; manual search is just the
// fallback for when it isn't (denied, unsupported, or not yet resolved).
function wxResolveQuery() { return wxLocQuery || wxCity || wxServerCity; }

function wxRefreshAll() {
  const q = wxResolveQuery();
  if (!q) return;
  homeWxLoad(q);
  if (typeof wxLoaded !== 'undefined' && wxLoaded && typeof loadWx === 'function') loadWx(q);
}

// Called by the Weather tab's search box (see weather/script.js).
function wxSetManualCity(city) {
  wxCity = city;
  localStorage.setItem('wxCity', city);
  wxRefreshAll();
}

// The city search bar only makes sense once we know we can't auto-locate --
// otherwise geolocation would just override it anyway. Guarded because the
// Weather tab (and its search bar) may not be loaded yet.
function wxUpdateCityBarVisibility() {
  const bar = document.getElementById('wx-city-bar');
  if (bar) bar.style.display = wxGeoDenied ? 'flex' : 'none';
}

function homeWxLoad(query) {
  if (!query || query === wxLoadedQuery) return;
  wxLoadedQuery = query;
  fetch(BASE_PATH + '/api/weather?city=' + encodeURIComponent(query))
    .then(r => r.json()).then(d => {
      if (!d.current_condition) return;
      const c = d.current_condition[0];
      document.getElementById('w-temp').textContent = c.temp_C + '°';
      document.getElementById('w-desc').textContent = c.weatherDesc[0].value;
      document.getElementById('w-city').textContent = d.nearest_area?.[0]?.areaName?.[0]?.value || query;
      document.getElementById('w-icon').innerHTML = wxEmoji(c.weatherCode);
      const wxCard = document.getElementById('home-wx-card');
      if (wxCard) {
        const code = +c.weatherCode;
        wxCard.classList.remove('wx-sunny','wx-cloudy','wx-rain','wx-storm','wx-snow');
        if ([113,116].includes(code)) wxCard.classList.add('wx-sunny');
        else if ([119,122,143,248,260].includes(code)) wxCard.classList.add('wx-cloudy');
        else if ([200,386,389,392,395].includes(code)) wxCard.classList.add('wx-storm');
        else if ([227,230,323,326,329,332,335,338,368,371,395].includes(code)) wxCard.classList.add('wx-snow');
        else wxCard.classList.add('wx-rain');
      }
    }).catch(() => { document.getElementById('w-desc').textContent = 'Unavailable'; });
}

function wxRequestLocation() {
  if (!navigator.geolocation) { wxGeoDenied = true; wxUpdateCityBarVisibility(); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const q = pos.coords.latitude.toFixed(4) + ',' + pos.coords.longitude.toFixed(4);
    wxLocQuery = q;
    localStorage.setItem('wxCoords', q);
    wxGeoDenied = false;
    wxUpdateCityBarVisibility();
    wxRefreshAll();
  }, () => { wxGeoDenied = true; wxUpdateCityBarVisibility(); }, { timeout: 10000, maximumAge: 10 * 60 * 1000 });
}

// ── Music card art tinting ────────────────────────────────────────────────
function tintMusicCard(src) {
  const card = document.getElementById('np-card');
  if (!card) return;
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.onload = () => {
    try {
      const cv = document.createElement('canvas');
      cv.width = cv.height = 8;
      const ctx = cv.getContext('2d');
      ctx.drawImage(img, 0, 0, 8, 8);
      const d = ctx.getImageData(0, 0, 8, 8).data;
      let r = 0, g = 0, b = 0, count = 0;
      for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i+1]; b += d[i+2]; count++; }
      r = Math.round(r / count);
      g = Math.round(g / count);
      b = Math.round(b / count);
      // Same low-alpha-wash-over-var(--surface) pattern as the CSS fallback
      // (home/style.css) -- a low, fixed alpha regardless of how bright the
      // sampled album art is keeps every track's tint at a consistent,
      // subtle strength and lets the user's actual surface color/opacity
      // theme setting show through, instead of a fully opaque sampled color
      // overriding it outright.
      card.style.background = 'linear-gradient(100deg,rgba(' + r + ',' + g + ',' + b + ',.16) 0%,transparent 55%),var(--surface)';
    } catch (e) {
      // Falls back to .home-mini-music's own CSS gradient (see home/style.css)
      // -- this can genuinely happen (a CORS-tainted canvas read against
      // whichever image CDN served this particular track's art), so it's
      // not treated as an error worth surfacing to the user, just logged
      // for anyone debugging why a specific track never got tinted.
      console.warn('[music] tintMusicCard: color sampling failed, using fallback gradient', e);
    }
  };
  img.src = src;
}

const wsProto = location.protocol === 'https:' ? 'wss:' : 'ws:';

function wsConnect() {
  ws = new WebSocket(wsProto + '//' + location.host + BASE_PATH + '/');

    wsReady = true;

    if (typeof liveInit === 'function') liveInit(ws);
  };
  ws.binaryType = 'arraybuffer';
  ws.onmessage = e => {
    if (e.data instanceof ArrayBuffer) {
      if (typeof liveOnMessage === 'function' && typeof liveActiveChannel !== 'undefined' && liveActiveChannel) {
        liveOnMessage({ _binary: e.data });
      } else if (mseSBuffer) { msePending.push(e.data); mseFlush(); }
      return;
    }
    try {
      const m = JSON.parse(e.data);
      if (m.type === 'status') {
        setChip(m.authenticated);
        ensureTab('music').then(() => {
          updateAuthScreen();
          if (m.authenticated) { showApp(); loadMusicHome(); api('/api/player').then(onPlayer).catch(() => {}); }
          else showAuth();
        });
      }
      if (m.type === 'player') {
        setChip(m.authenticated);
        ensureTab('music').then(() => {
          if (m.authenticated) { showApp(); onPlayer(m); } else showAuth();
        });
      }
      if (m.type === 'asset-version') _checkAssetVersion(m.v);
      if (m.type === 'mse-broadcaster-status') mseSetBroadcasterOnline(m.online, m.mimeType);
      if ((m.type === 'live-list' || m.type === 'live-channel-ended') && typeof liveOnMessage === 'function') liveOnMessage(m);
      if (m.type === 'radio-remote' && typeof radioOnRemote === 'function') radioOnRemote(m);
    } catch {}
  };
  ws.onclose = ws.onerror = () => {
    wsReady = false;
    setChip(false);
    setTimeout(wsConnect, 3000);
  };
}
wsConnect();
window.addEventListener('message', e => {
  if (e.data && (e.data.type === 'SP_MESSAGE' || e.data.type === 'SP_DEBUG' || e.data.topic))
    console.log('[iframe-msg]', JSON.stringify(e.data).slice(0, 200));
});

                _oauthErr === 'state_mismatch'    ? 'Auth session expired — please try again.' :
