<div class="chat-wrap" style="position:relative">

  <!-- Login overlay — shown until Discord is linked (chat's only identity source) -->
  <div class="chat-login-overlay" id="chat-login-overlay">
    <div class="chat-login-box">
      <div class="chat-login-title">Sign in to Chat</div>
      <div class="chat-login-sub">Get a persistent name and avatar for chat.</div>
      <button class="chat-name-save-btn chat-login-discord-btn" onclick="chatLoginDiscord()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M20.3 4.4A19.7 19.7 0 0 0 15.6 3c-.2.4-.5.9-.6 1.3a18.3 18.3 0 0 0-5.9 0A8.5 8.5 0 0 0 8.4 3a19.7 19.7 0 0 0-4.7 1.4C1 8.9.3 13.3.6 17.6a19.8 19.8 0 0 0 6 3c.5-.6.9-1.4 1.3-2.1-.7-.3-1.4-.6-2-1.1l.5-.4a14.2 14.2 0 0 0 12 0l.5.4c-.6.4-1.3.8-2 1.1.4.7.8 1.4 1.3 2.1a19.7 19.7 0 0 0 6-3c.4-5-.9-9.3-3.9-13.2zM9 15c-1 0-1.9-1-1.9-2.2S8 10.7 9 10.7s2 1 1.9 2.2C10.9 14 10 15 9 15zm6.9 0c-1 0-1.9-1-1.9-2.2s.9-2.2 1.9-2.2 2 1 1.9 2.2c0 1.2-.9 2.2-1.9 2.2z"/></svg>
        Sign in with Discord
      </button>
      <div id="chat-login-err" class="chat-modal-err"></div>
    </div>
  </div>

  <!-- Sidebar -->
  <div class="chat-sidebar">
    <div class="chat-sidebar-body" id="chat-sidebar-body">
      <div class="chat-section-label" style="padding-top:12px">Rooms</div>
      <div class="chat-room-item active" id="chat-room-global" data-room="global" onclick="chatOpenRoom('global')">
        <div class="chat-room-icon">🌐</div>
        <div class="chat-room-name">Global</div>
        <div class="chat-room-badge" id="chat-unread-global" style="display:none">0</div>
      </div>
      <div class="chat-section-label">
        <span>Groups</span>
        <button class="chat-add-btn" title="Create or join a group" onclick="chatShowGroupMenu()">+</button>
      </div>
      <div id="chat-groups-list"></div>
      <div class="chat-section-label" id="chat-dms-label">
        <span>Direct Messages</span>
        <button class="chat-add-btn" title="New DM" onclick="chatShowNewDM()">+</button>
      </div>
      <div id="chat-dms-list"></div>
    </div>
    <div class="chat-account-row" id="chat-account-row" style="display:none">
      <div id="chat-account-avatar"></div>
      <div class="chat-account-name" id="chat-account-name"></div>
      <button class="chat-account-settings-btn" onclick="chatOpenSettings()" title="Account settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </div>
  </div>

  <!-- Main -->
  <div class="chat-main">
    <div class="chat-topbar">
      <div class="chat-room-title" id="chat-room-title">Global</div>
      <button class="chat-call-btn" id="chat-call-btn" onclick="chatToggleCall()">📞 Call</button>
    </div>
    <div class="chat-ann-bar" id="chat-ann-bar" style="display:none">
      <div class="chat-ann-icon">📢</div>
      <div class="chat-ann-label">Server</div>
      <div class="chat-ann-text" id="chat-ann-text"></div>
      <div class="chat-ann-time" id="chat-ann-time"></div>
      <button class="chat-ann-close" onclick="document.getElementById('chat-ann-bar').style.display='none'" title="Dismiss">✕</button>
    </div>
    <div class="chat-call-bar" id="chat-call-bar">
      <div class="chat-call-label">🔊 In call</div>
      <div class="chat-call-peers" id="chat-call-peers"></div>
      <button class="chat-mute-btn" id="chat-mute-btn" onclick="chatToggleMute()">Mute</button>
      <button class="chat-mute-btn" onclick="chatLeaveCall()" style="color:#ff8080">Leave</button>
    </div>
    <div class="chat-messages" id="chat-messages" style="position:relative;">
      <div class="chat-empty" id="chat-empty">
        <div class="chat-empty-icon">💬</div>
        <div class="chat-empty-text">No messages yet. Say hello!</div>
      </div>
      <div class="chat-messages-inner" id="chat-messages-inner"></div>
    </div>
    <div class="chat-input-bar">
      <textarea class="chat-input" id="chat-input" placeholder="Message…" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatSend();}"
        oninput="this.style.height='auto';this.style.height=Math.min(this.scrollHeight,120)+'px'"></textarea>
      <button class="chat-send-btn" onclick="chatSend()">Send</button>
    </div>
  </div>

</div>
