  <main class="page">

    <!-- Theme card -->
    <div class="theme-card">
      <div class="theme-card-hdr">
        <div class="theme-card-ico">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--primary)"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        </div>
        <span class="theme-card-title">Theme</span>
      </div>
      <div id="theme-panel"></div>
    </div>

    <!-- Device name card -->
    <div class="theme-card">
      <div class="theme-card-hdr">
        <div class="theme-card-ico">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--primary)"><path d="M4 4h16v11H4zM2 19h20v2H2zm7-2h6v2H9z"/></svg>
        </div>
        <span class="theme-card-title">Device name</span>
      </div>
      <p style="font-size:12.5px;color:var(--text-muted);margin:-8px 0 14px;line-height:1.5;">
        Shown to other devices picking where to play Radio — e.g. "Kitchen Tablet" instead of whichever chat account happens to be signed in here.
      </p>
      <div style="display:flex;gap:8px;">
        <input id="device-name-input" class="creds-input" type="text" placeholder="This device" maxlength="40" autocomplete="off" spellcheck="false" style="flex:1;" onkeydown="if(event.key==='Enter')saveDeviceName()">
        <button class="btn btn-primary" onclick="saveDeviceName()" style="flex-shrink:0;">Save</button>
      </div>
      <div id="device-name-status" style="font-size:12px;color:var(--text-muted);margin-top:8px;height:14px;"></div>
    </div>

  </main>
